server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: synexora-api
  datasource:
    url: jdbc:h2:mem:synexoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

synexora:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
  jwt:
    secret: ${JWT_SECRET:synexora_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security}
    expiration-ms: 86400000
